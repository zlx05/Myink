# Myink CI：PR / 主分支门禁（格式检查 + 全量回归 + 镜像构建，plan.md §阶段 5 余项「CI」）。
# 四个 job 并行：python（全新 PG + Redis + RabbitMQ 服务容器，测前 myink init）/ go（网关 vet+test）/ frontend / build-images。
# 关键设计：Python 测试用「全新 PG」服务容器——刚修过的部署 bug（索引名冲突 / schema CREATE 权限）
# 都是全新库才暴露的类型，CI 用 fresh 库跑全量回归就是那道闸；EMBED_ENABLED=0 不装 ml extras（torch）。
# 无 git remote 时本地等价验证：bash scripts/ci-local.sh（同一套门禁，见 docs/DEPLOY.md）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python 全量回归：pgvector + Redis + RabbitMQ 服务容器。
  # checkout 后执行角色初始化 SQL，再建表和 seed。
  python:
    name: Python 全量回归（全新 PG）
    runs-on: ubuntu-latest
    env:
      EMBED_ENABLED: "0"
      AMQP_URL: amqp://myink:myink@localhost:5672/
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: myink
          POSTGRES_PASSWORD: myink
          POSTGRES_DB: myink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myink -d myink"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: myink
          RABBITMQ_DEFAULT_PASS: myink
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（dev extras，不装 ml/torch）
        run: pip install -e '.[dev]'
      - name: Python 语法检查
        run: python -m compileall -q src tests
      - name: 创建测试业务角色（checkout 后执行，避免 service 提前挂载空目录）
        env:
          PGPASSWORD: myink
        run: psql -h localhost -U myink -d myink -v ON_ERROR_STOP=1 -f docker/initdb/01-roles.sql
      - name: 初始化（建表 + RLS + seed，幂等）
        run: myink init
      - name: 契约导出 + diff 闸（改响应模型未重新导出 spec 即红）
        run: |
          myink contract export
          git diff --exit-code -- spec/api-openapi.json
      - name: 全量回归（LLM/embedding 使用替身）
        run: python -m pytest tests/ -q

  # Go 网关：需要 Redis + RabbitMQ（Python API 用 httptest 假服务，不依赖 8100）。
  # Redis 不通时 newTestRedis 会 t.Skipf 整体跳过而非失败——显式拦截「绿灯空转」。
  go:
    name: Go 网关（vet + 单测）
    runs-on: ubuntu-latest
    env:
      AMQP_URL: amqp://myink:myink@localhost:5672/
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: myink
          RABBITMQ_DEFAULT_PASS: myink
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: go vet
        working-directory: gateway
        run: go vet ./...
      - name: go test（拦截 SKIP：Redis/RabbitMQ 未就绪不允许静默通过）
        working-directory: gateway
        run: |
          rc=0
          go test -count=1 -v ./... > /tmp/go-test.log 2>&1 || rc=$?
          cat /tmp/go-test.log
          if grep -q -- '--- SKIP' /tmp/go-test.log; then
            echo "::error::检测到 SKIP（Redis/RabbitMQ 服务未就绪），CI 不允许绿灯空转"
            exit 1
          fi
          exit $rc

  # 前端：oxlint + vitest + tsc/vite build（工具函数单测 + jsdom 编辑器交互回归）。
  frontend:
    name: 前端（lint + 单测 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: lint（oxlint）
        run: npm run lint
      - name: 单测（vitest）
        run: npm test
      - name: 构建（tsc -b && vite build）
        run: npm run build

  # 镜像构建：GitHub runner 境外网络用官方源即可（pypi / npmjs / goproxy），
  # 不需 daocloud/aliyun 覆盖（那是本地 compose 的国内源参数）。
  build-images:
    name: 镜像构建（Python + 网关）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 镜像（api/worker 共用，核心依赖）
        run: docker build -f Dockerfile -t myink-api:ci .
      - name: 网关镜像（node 构建 dist + go 静态编译 → slim）
        run: docker build -f gateway/Dockerfile -t myink-gateway:ci .
