[project]
name = "myink"
version = "0.1.0"
description = "Myink - 面向长篇网文的多 Agent 智能创作助手（推理层，阶段 1）"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.30",
    "cryptography>=42.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    # 阶段 2：Redis + Python API（§阶段2，worker/api 复用核心模块）
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
    # 阶段 6：RabbitMQ 任务队列（替代 Redis Streams 主队列 + ZSET 延迟 + 网关 dispatcher）
    "pika>=1.3",
    # 阶段 3：JWT 身份断言（§14.1 ③，签发端点；网关验签走 golang-jwt，密钥共享 .env）
    "pyjwt>=2.8",
    # 阶段 3：MCP Client（§10，接入外部榜单工具）：锁 1.x（v2 有破坏性变更：snake_case/httpx2），
    # 所有 mcp import 隔离在 myink/integrations/mcp.py 单文件，升 2.x 只改那一处 + 版本号。
    "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# 向量能力（§5.2 一库多用）：bge-m3 本地 embedding（1024 维），DeepSeek 官方无 embedding 接口故本地加载。
# 默认不装（torch 依赖 ~2GB、国内镜像源下载易抖）：embedder 延迟导入，EMBED_ENABLED=0 完全不加载，
# 纯关系链路降级可用（§6.12 数据层）。需要时 `pip install -e .[ml]`（Docker 镜像按需，见 docs/DEPLOY.md）。
ml = [
    "sentence-transformers>=3.0",
]

[project.scripts]
myink = "myink.cli:app"
myink-worker = "myink.worker.entry:run"
myink-api = "myink.api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
